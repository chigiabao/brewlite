# A – Platform. Lần đầu: docker compose up -d --build --wait; Prisma migrate deploy + seed chạy trong backend.
# Không dùng mật khẩu demo cho môi trường internet/public.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brew}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brew}
      POSTGRES_DB: ${POSTGRES_DB:-brewlite}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-brew}:${POSTGRES_PASSWORD:-brew}@db:5432/${POSTGRES_DB:-brewlite}
      JWT_SECRET: ${JWT_SECRET:-local-only-change-me-before-deploy}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      PORT: 3001
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-MOCK}
      MOCK_GATEWAY_TEST_MODE: ${MOCK_GATEWAY_TEST_MODE:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_URL: ${VNPAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:3001/payments/vnpay/return}
      VNPAY_IPN_URL: ${VNPAY_IPN_URL:-http://localhost:3001/payments/vnpay/ipn}
      ENABLE_ORDER_AUTO_CANCEL: ${ENABLE_ORDER_AUTO_CANCEL:-true}
      ENABLE_STRIPE_REFUND: ${ENABLE_STRIPE_REFUND:-true}
      ORDER_PAYMENT_EXPIRY_MINUTES: ${ORDER_PAYMENT_EXPIRY_MINUTES:-30}
      CHECKOUT_SESSION_TTL_MINUTES: ${CHECKOUT_SESSION_TTL_MINUTES:-31}
    depends_on:
      db:
        condition: service_healthy
    ports: ["3001:3001"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    depends_on:
      backend:
        condition: service_healthy
    ports: ["3000:3000"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

volumes:
  dbdata:
