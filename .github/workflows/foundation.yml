name: BrewLite Release Gates (FIX 12)

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  contract:
    name: Contract & Ownership Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify Foundation & Shared Contract Lock
        run: node scripts/verify-foundation.mjs
      - name: FIX 12 release invariants (dependency-free checks)
        run: node --test scripts/fix12-contract.test.mjs

  backend:
    name: Backend (Prisma + Seed x2 + Lint + Build + Unit + E2E)
    needs: [contract]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brew
          POSTGRES_PASSWORD: brew
          POSTGRES_DB: brewlite
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U brew -d brewlite"
          --health-interval=3s
          --health-timeout=3s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://brew:brew@127.0.0.1:5432/brewlite?schema=public
      JWT_SECRET: ci-only-test-jwt-secret
      FRONTEND_URL: http://localhost:3000
      PORT: 3001
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Prisma validate
        run: npx prisma validate
      - name: Prisma migrate deploy (Clean DB)
        run: npx prisma migrate deploy
      - name: Prisma generate
        run: npx prisma generate
      - name: Prisma db seed (Run #1)
        run: npx prisma db seed
      - name: Capture seed snapshot (no PII)
        run: node scripts/seed-fingerprint.mjs --write ../.ci-artifacts/seed-before.json
      - name: Prisma db seed (Run #2)
        run: npx prisma db seed
      - name: ASSERT seed idempotency (fingerprint unchanged)
        run: node scripts/seed-fingerprint.mjs --compare ../.ci-artifacts/seed-before.json --write ../.ci-artifacts/seed-after.json
      - name: Backend lint
        run: npm run lint
      - name: Backend build
        run: npm run build
      - name: Backend unit tests
        run: npm test
      - name: Backend E2E & integration tests
        run: npm run test:e2e
      - name: Upload seed verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-seed-fingerprints
          path: .ci-artifacts/
          if-no-files-found: warn

  frontend:
    name: Frontend (Lint + Build)
    needs: [contract]
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Frontend unit tests
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Frontend lint
        run: npm run lint
      - name: Frontend build
        run: npm run build

  docker-smoke:
    name: Docker Compose Smoke (HTTP 200 + Healthcheck + Seed x2)
    needs: [contract, backend, frontend]
    runs-on: ubuntu-latest
    env:
      # CI uses a fresh DB; enable the deterministic declined Mock scenario.
      MOCK_GATEWAY_TEST_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Ensure new clean Docker project volume
        run: docker compose down -v --remove-orphans
      - name: Build and start stack with healthcheck wait
        run: docker compose up -d --build --wait
      - name: Check service status
        run: |
          mkdir -p .ci-artifacts
          docker compose ps | tee .ci-artifacts/docker-compose-ps.txt
      - name: Check backend HTTP 200
        run: curl --fail --silent --show-error -i http://localhost:3001/
      - name: Check frontend HTTP 200
        run: curl --fail --silent --show-error -I http://localhost:3000/
      - name: Check Prisma migration status in container
        run: docker compose exec -T backend npx prisma migrate status
      - name: Capture seed data in running Docker stack
        run: docker compose exec -T backend node scripts/seed-fingerprint.mjs --write /tmp/seed-f05-before.json | tee .ci-artifacts/docker-seed-before.txt
      - name: Re-run seed inside container
        run: docker compose exec -T backend npx prisma db seed
      - name: ASSERT Docker seed idempotency
        run: docker compose exec -T backend node scripts/seed-fingerprint.mjs --compare /tmp/seed-f05-before.json --write /tmp/seed-f05-after.json | tee .ci-artifacts/docker-seed-after.txt
      - name: HTTP + JWT boundary smoke
        run: node scripts/smoke-http.mjs | tee .ci-artifacts/http-smoke.json
      - name: FIX 12 Mock payment E2E (fresh CI database only)
        env:
          BREWLITE_ALLOW_TEST_WRITES: '1'
        run: node scripts/smoke-e2e.mjs | tee .ci-artifacts/fix12-smoke-e2e.json
      - name: Install browser regression dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser checkout, retry, cancellation and VNPay return regression
        working-directory: frontend
        env:
          BREWLITE_ALLOW_TEST_WRITES: '1'
          BREWLITE_E2E_UI: http://localhost:3000
          BREWLITE_E2E_API: http://localhost:3001
        run: npm run test:e2e
      - name: Upload browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-checkout-regression
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
      - name: Upload Docker/HTTP verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-http-smoke
          path: .ci-artifacts/
          if-no-files-found: warn
      - name: Save container logs
        if: always()
        run: docker compose logs --no-color backend frontend db
      - name: Cleanup stack and volumes
        if: always()
        run: docker compose down -v --remove-orphans
