<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 980" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="startGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="endGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="custProc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="sysProc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="decGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Title Banner -->
  <rect x="25" y="20" width="970" height="60" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <rect x="25" y="20" width="8" height="60" rx="4" fill="url(#headerGrad)" />
  <text x="45" y="45" fill="#f8fafc" font-size="16" font-weight="800">SƠ ĐỒ HOẠT ĐỘNG (ACTIVITY DIAGRAM) — MODULE B: CATALOG &amp; STOCK</text>
  <text x="45" y="65" fill="#94a3b8" font-size="12">Quy trình: Xem Menu ➔ Xem Chi Tiết ➔ Kiểm Tra Tồn Kho ➔ Tùy Chỉnh Size/Topping ➔ Thêm Vào Giỏ Hàng</text>

  <!-- ================= SWIMLANES ================= -->
  <!-- Lane 1: Customer -->
  <rect x="25" y="95" width="460" height="850" rx="12" fill="#0b1120" stroke="#334155" stroke-width="1.5" />
  <rect x="25" y="95" width="460" height="42" rx="12" fill="#1e293b" />
  <text x="255" y="122" fill="#38bdf8" font-size="14" font-weight="800" text-anchor="middle">👤 KHÁCH HÀNG (CUSTOMER)</text>

  <!-- Lane 2: System Catalog -->
  <rect x="535" y="95" width="460" height="850" rx="12" fill="#0b1120" stroke="#334155" stroke-width="1.5" />
  <rect x="535" y="95" width="460" height="42" rx="12" fill="#1e293b" />
  <text x="765" y="122" fill="#f59e0b" font-size="14" font-weight="800" text-anchor="middle">💻 HỆ THỐNG BREWLITE (CATALOG &amp; STORE)</text>

  <!-- ================= STEP 1: START & MENU ================= -->
  <!-- Start Node -->
  <rect x="180" y="160" width="150" height="38" rx="19" fill="url(#startGrad)" filter="url(#glow)" />
  <text x="255" y="184" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">● BẮT ĐẦU</text>

  <!-- Menu Process -->
  <rect x="145" y="225" width="220" height="45" rx="8" fill="url(#custProc)" stroke="#475569" stroke-width="1.5" filter="url(#glow)" />
  <text x="255" y="252" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">Truy cập trang Menu đồ uống</text>

  <!-- System Fetch -->
  <rect x="635" y="225" width="260" height="45" rx="8" fill="url(#sysProc)" stroke="#3b82f6" stroke-width="1.5" filter="url(#glow)" />
  <text x="765" y="244" fill="#93c5fd" font-size="11" font-weight="700" text-anchor="middle">GET /products</text>
  <text x="765" y="260" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">Tải &amp; Hiển thị danh sách món</text>

  <!-- ================= STEP 2: DETAIL & STOCK ================= -->
  <!-- Click Product -->
  <rect x="145" y="315" width="220" height="45" rx="8" fill="url(#custProc)" stroke="#475569" stroke-width="1.5" filter="url(#glow)" />
  <text x="255" y="342" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">Click chọn 1 sản phẩm</text>

  <!-- System Detail -->
  <rect x="635" y="315" width="260" height="45" rx="8" fill="url(#sysProc)" stroke="#3b82f6" stroke-width="1.5" filter="url(#glow)" />
  <text x="765" y="334" fill="#93c5fd" font-size="11" font-weight="700" text-anchor="middle">GET /products/:id</text>
  <text x="765" y="350" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">Tải chi tiết &amp; Tồn kho (stock)</text>

  <!-- Init State -->
  <rect x="645" y="390" width="240" height="42" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1" filter="url(#glow)" />
  <text x="765" y="415" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="middle">Khởi tạo State: Size S, 0 Topping</text>

  <!-- Check Stock Decision -->
  <polygon points="765,460 885,495 765,530 645,495" fill="url(#decGrad)" stroke="#f59e0b" stroke-width="2" filter="url(#glow)" />
  <text x="765" y="492" fill="#fef3c7" font-size="12" font-weight="800" text-anchor="middle">Tồn kho</text>
  <text x="765" y="506" fill="#fcd34d" font-size="11" font-weight="700" text-anchor="middle">(stock &gt; 0)?</text>

  <!-- Stock Out (Left) -->
  <rect x="560" y="560" width="180" height="42" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.5" />
  <text x="650" y="578" fill="#fca5a5" font-size="11" font-weight="700" text-anchor="middle">Nút Add bị KHÓA</text>
  <text x="650" y="593" fill="#f87171" font-size="10" text-anchor="middle">Hiện nhãn "Hết hàng"</text>

  <!-- Stock In (Right) -->
  <rect x="790" y="560" width="180" height="42" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
  <text x="880" y="578" fill="#a7f3d0" font-size="11" font-weight="700" text-anchor="middle">Nút Add MỞ</text>
  <text x="880" y="593" fill="#34d399" font-size="10" text-anchor="middle">Cho phép đặt món</text>

  <!-- UI Ready -->
  <rect x="655" y="635" width="220" height="42" rx="8" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)" />
  <text x="765" y="661" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">✓ Giao diện Chi Tiết Sẵn Sàng</text>

  <!-- ================= STEP 3: CUSTOMER ACTION ================= -->
  <!-- Decision: Customer Action -->
  <polygon points="255,620 375,655 255,690 135,655" fill="#374151" stroke="#9ca3af" stroke-width="1.5" filter="url(#glow)" />
  <text x="255" y="652" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">Khách hàng</text>
  <text x="255" y="666" fill="#e5e7eb" font-size="11" text-anchor="middle">chọn thao tác gì?</text>

  <!-- Action 1: Change Option -->
  <rect x="145" y="730" width="220" height="42" rx="8" fill="url(#custProc)" stroke="#475569" stroke-width="1.5" filter="url(#glow)" />
  <text x="255" y="756" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">Đổi Size (M/L) hoặc Topping</text>

  <!-- Recalculate System -->
  <rect x="635" y="730" width="260" height="42" rx="8" fill="url(#sysProc)" stroke="#3b82f6" stroke-width="1.5" filter="url(#glow)" />
  <text x="765" y="755" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">Tính lại giá mới &amp; Cập nhật State</text>

  <!-- Action 2: Click Add to Cart -->
  <rect x="145" y="810" width="220" height="42" rx="8" fill="#047857" stroke="#10b981" stroke-width="1.5" filter="url(#glow)" />
  <text x="255" y="836" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">🛒 Bấm "Thêm vào giỏ"</text>

  <!-- System Store -->
  <rect x="635" y="810" width="260" height="42" rx="8" fill="url(#sysProc)" stroke="#3b82f6" stroke-width="1.5" filter="url(#glow)" />
  <text x="765" y="830" fill="#93c5fd" font-size="11" font-weight="700" text-anchor="middle">Lưu Zustand / LocalStorage</text>
  <text x="765" y="844" fill="#cbd5e1" font-size="10" text-anchor="middle">Snapshot: id, size, toppings, price</text>

  <!-- Toast Notification -->
  <rect x="645" y="875" width="240" height="38" rx="8" fill="#065f46" stroke="#34d399" stroke-width="1" filter="url(#glow)" />
  <text x="765" y="899" fill="#d1fae5" font-size="12" font-weight="700" text-anchor="middle">✓ Bật Toast &amp; Tăng Cart Badge</text>

  <!-- End Node -->
  <rect x="690" y="930" width="150" height="36" rx="18" fill="url(#endGrad)" filter="url(#glow)" />
  <text x="765" y="953" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">■ KẾT THÚC</text>


  <!-- ================= CONNECTING ARROWS ================= -->
  <!-- Start -> Menu -->
  <line x1="255" y1="198" x2="255" y2="225" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Menu -> Fetch -->
  <line x1="365" y1="247" x2="635" y2="247" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Fetch -> Click Product -->
  <path d="M 765 270 L 765 295 L 255 295 L 255 315" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Click Product -> Detail -->
  <line x1="365" y1="337" x2="635" y2="337" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Detail -> Init State -->
  <line x1="765" y1="360" x2="765" y2="390" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Init State -> Decision -->
  <line x1="765" y1="432" x2="765" y2="460" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)" />

  <!-- Decision -> Stock Out (Left) -->
  <path d="M 645 495 L 610 495 L 610 560" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)" />
  <text x="590" y="485" fill="#fca5a5" font-size="10" font-weight="700">Hết hàng</text>

  <!-- Decision -> Stock In (Right) -->
  <path d="M 885 495 L 920 495 L 920 560" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)" />
  <text x="925" y="485" fill="#6ee7b7" font-size="10" font-weight="700">Còn hàng</text>

  <!-- Merge to UI Ready -->
  <path d="M 650 602 L 650 618 L 765 618 L 765 635" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 880 602 L 880 618 L 765 618" fill="none" stroke="#38bdf8" stroke-width="2" />

  <!-- UI Ready -> Customer Action -->
  <line x1="655" y1="655" x2="375" y2="655" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Action -> Change Option -->
  <line x1="255" y1="690" x2="255" y2="730" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <text x="265" y="712" fill="#94a3b8" font-size="11">Đổi tùy chọn</text>

  <!-- Change Option -> Recalc -->
  <line x1="365" y1="751" x2="635" y2="751" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Recalc -> Loop back to UI Ready -->
  <path d="M 895 751 L 930 751 L 930 655 L 875 655" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Action -> Click Add to Cart -->
  <path d="M 135 655 L 90 655 L 90 831 L 145 831" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)" />
  <text x="95" y="805" fill="#a7f3d0" font-size="11" font-weight="700">Thêm vào giỏ</text>

  <!-- Click Add -> System Store -->
  <line x1="365" y1="831" x2="635" y2="831" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)" />

  <!-- Store -> Toast -->
  <line x1="765" y1="852" x2="765" y2="875" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)" />

  <!-- Toast -> End -->
  <line x1="765" y1="913" x2="765" y2="930" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)" />

</svg>
