<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 680" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="concHdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrErr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="arrOk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>

    <!-- Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Banner -->
  <rect x="25" y="15" width="970" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <rect x="25" y="15" width="8" height="55" rx="4" fill="url(#concHdr)" />
  <text x="45" y="40" fill="#f8fafc" font-size="16" font-weight="700">SƠ ĐỒ XỬ LÝ CẠNH TRANH ĐỒNG THỜI (CONCURRENT SIGNUP RACE CONDITION) — SPRINT 3</text>
  <text x="45" y="58" fill="#94a3b8" font-size="11">5 request đăng ký cùng 1 email chạy song song: Duy nhất 1 request thành công (201 Created), 4 request còn lại nhận 409 Conflict</text>

  <!-- Lifeline Participants -->
  <!-- 1: 5 Concurrent Clients -->
  <g transform="translate(80, 90)">
    <rect x="-65" y="0" width="135" height="40" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)" />
    <text x="2" y="19" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">5 Concurrent Clients</text>
    <text x="2" y="33" fill="#94a3b8" font-size="9" text-anchor="middle">(Promise.all parallel)</text>
    <line x1="2" y1="40" x2="2" y2="540" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />
  </g>

  <!-- 2: AuthController -->
  <g transform="translate(320, 90)">
    <rect x="-60" y="0" width="125" height="40" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)" />
    <text x="2" y="24" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">AuthController</text>
    <line x1="2" y1="40" x2="2" y2="540" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />
  </g>

  <!-- 3: AuthService -->
  <g transform="translate(560, 90)">
    <rect x="-60" y="0" width="125" height="40" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)" />
    <text x="2" y="19" fill="#d8b4fe" font-size="11" font-weight="700" text-anchor="middle">AuthService</text>
    <text x="2" y="33" fill="#94a3b8" font-size="9" text-anchor="middle">register(dto)</text>
    <line x1="2" y1="40" x2="2" y2="540" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />
  </g>

  <!-- 4: PostgreSQL DB Engine -->
  <g transform="translate(830, 90)">
    <rect x="-85" y="0" width="175" height="40" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)" />
    <text x="2" y="19" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">PostgreSQL / Prisma</text>
    <text x="2" y="33" fill="#94a3b8" font-size="9" text-anchor="middle">UNIQUE INDEX ON (email)</text>
    <line x1="2" y1="40" x2="2" y2="540" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />
  </g>

  <!-- PARALLEL INCOMING REQUESTS -->
  <g transform="translate(50, 150)">
    <rect x="0" y="0" width="910" height="70" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="15" y="20" fill="#38bdf8" font-size="11" font-weight="700">GIAI ĐOẠN 1: 5 YÊU CẦU ĐẾN CÙNG LÚC (CONCURRENT BURST)</text>

    <line x1="32" y1="35" x2="268" y2="35" stroke="#38bdf8" stroke-width="1.2" marker-end="url(#arr)" />
    <line x1="32" y1="43" x2="268" y2="43" stroke="#38bdf8" stroke-width="1.2" marker-end="url(#arr)" />
    <line x1="32" y1="51" x2="268" y2="51" stroke="#38bdf8" stroke-width="1.2" marker-end="url(#arr)" />
    <line x1="32" y1="59" x2="268" y2="59" stroke="#38bdf8" stroke-width="1.2" marker-end="url(#arr)" />
    <line x1="32" y1="67" x2="268" y2="67" stroke="#38bdf8" stroke-width="1.2" marker-end="url(#arr)" />
    <text x="150" y="48" fill="#e2e8f0" font-size="10" text-anchor="middle">5x POST /auth/register {email: "concurrent@brewlite.test"}</text>
  </g>

  <!-- GIAI ĐOẠN 2: DB UNIQUE CONSTRAINT ARBITRATION -->
  <g transform="translate(50, 240)">
    <rect x="0" y="0" width="910" height="155" rx="6" fill="#0b1329" stroke="#334155" stroke-width="1" />
    <text x="15" y="20" fill="#fbbf24" font-size="11" font-weight="700">GIAI ĐOẠN 2: TRANH CHẤP GIAO DỊCH VÀ KHÓA DUY NHẤT TẠI CƠ SỞ DỮ LIỆU</text>

    <!-- Winner request -->
    <line x1="272" y1="45" x2="508" y2="45" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrOk)" />
    <text x="390" y="38" fill="#a7f3d0" font-size="10" text-anchor="middle">Request #1: prisma.user.create()</text>

    <line x1="512" y1="45" x2="778" y2="45" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrOk)" />
    <text x="645" y="38" fill="#a7f3d0" font-size="10" text-anchor="middle">INSERT thành công (Winner tx)</text>

    <line x1="778" y1="65" x2="512" y2="65" stroke="#10b981" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrOk)" />
    <text x="645" y="60" fill="#a7f3d0" font-size="9" text-anchor="middle">commit -> record id=1 created</text>

    <!-- 4 Loser requests -->
    <line x1="272" y1="95" x2="508" y2="95" stroke="#f43f5e" stroke-width="1.5" marker-end="url(#arrErr)" />
    <text x="390" y="88" fill="#fca5a5" font-size="10" text-anchor="middle">Requests #2..#5: prisma.user.create() song song</text>

    <line x1="512" y1="95" x2="778" y2="95" stroke="#f43f5e" stroke-width="1.5" marker-end="url(#arrErr)" />
    <text x="645" y="88" fill="#fca5a5" font-size="10" text-anchor="middle">Trùng UNIQUE index email -> Throw P2002</text>

    <line x1="778" y1="120" x2="512" y2="120" stroke="#f43f5e" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrErr)" />
    <text x="645" y="115" fill="#fca5a5" font-size="9" text-anchor="middle">PrismaClientKnownRequestError code: 'P2002'</text>

    <path d="M 512 125 C 475 125 475 145 508 145" stroke="#f43f5e" stroke-width="1.2" fill="none" marker-end="url(#arrErr)" />
    <text x="460" y="140" fill="#fca5a5" font-size="9" text-anchor="end">catch isUniqueViolation() -> throw ConflictException</text>
  </g>

  <!-- GIAI ĐOẠN 3: KẾT QUẢ TRẢ VỀ CHO CLIENT -->
  <g transform="translate(50, 415)">
    <rect x="0" y="0" width="910" height="135" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1" />
    <text x="15" y="20" fill="#34d399" font-size="11" font-weight="700">GIAI ĐOẠN 3: PHÂN PHỐI KẾT QUẢ ĐẦU RA (1x 201 CREATED &amp; 4x 409 CONFLICT)</text>

    <!-- Response 201 -->
    <line x1="508" y1="45" x2="32" y2="45" stroke="#10b981" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrOk)" />
    <text x="270" y="38" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle">[Duy nhất 1 Request] HTTP 201 Created { id: 1, email: "concurrent@brewlite.test" }</text>

    <!-- Responses 409 -->
    <line x1="508" y1="80" x2="32" y2="80" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrErr)" />
    <line x1="508" y1="90" x2="32" y2="90" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrErr)" />
    <line x1="508" y1="100" x2="32" y2="100" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrErr)" />
    <line x1="508" y1="110" x2="32" y2="110" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrErr)" />
    <text x="270" y="75" fill="#fca5a5" font-size="11" font-weight="700" text-anchor="middle">[4 Requests còn lại] HTTP 409 Conflict ("Email đã được đăng ký")</text>
  </g>

  <!-- Footer -->
  <g transform="translate(25, 635)">
    <rect x="0" y="0" width="970" height="30" rx="6" fill="#1e293b" />
    <text x="20" y="19" fill="#94a3b8" font-size="11">DoD Check: Kiểm chứng race condition đạt 100% | Chỉ tạo đúng 1 record trong database | Bắt lỗi P2002 chuyển thành HTTP 409 chuẩn xác</text>
  </g>
</svg>
