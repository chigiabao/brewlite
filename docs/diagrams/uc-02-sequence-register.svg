<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 720" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="seqHdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrErr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="arrOk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>

    <!-- Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Banner -->
  <rect x="25" y="15" width="970" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <rect x="25" y="15" width="8" height="55" rx="4" fill="url(#seqHdr)" />
  <text x="45" y="40" fill="#f8fafc" font-size="16" font-weight="700">SƠ ĐỒ TUẦN TỰ — UC-02.1: ĐĂNG KÝ TÀI KHOẢN (POST /auth/register)</text>
  <text x="45" y="58" fill="#94a3b8" font-size="11">Xử lý nhánh chuẩn hoá email, băm mật khẩu bcrypt 12 rounds, kiểm tra trùng 409 Conflict, an toàn không lộ passwordHash</text>

  <!-- Lifeline Participants -->
  <!-- 1: Client -->
  <g transform="translate(60, 90)">
    <rect x="-45" y="0" width="105" height="40" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)" />
    <text x="7" y="24" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">Client (UI/App)</text>
    <line x1="7" y1="40" x2="7" y2="580" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />
  </g>

  <!-- 2: ValidationPipe -->
  <g transform="translate(230, 90)">
    <rect x="-55" y="0" width="125" height="40" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)" />
    <text x="7" y="24" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="middle">ValidationPipe</text>
    <line x1="7" y1="40" x2="7" y2="580" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />
  </g>

  <!-- 3: AuthController -->
  <g transform="translate(420, 90)">
    <rect x="-55" y="0" width="125" height="40" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)" />
    <text x="7" y="24" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">AuthController</text>
    <line x1="7" y1="40" x2="7" y2="580" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />
  </g>

  <!-- 4: AuthService -->
  <g transform="translate(610, 90)">
    <rect x="-50" y="0" width="120" height="40" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)" />
    <text x="10" y="24" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">AuthService</text>
    <line x1="10" y1="40" x2="10" y2="580" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />
  </g>

  <!-- 5: bcrypt &amp; Prisma -->
  <g transform="translate(800, 90)">
    <rect x="-50" y="0" width="120" height="40" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)" />
    <text x="10" y="24" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">bcrypt / Prisma</text>
    <line x1="10" y1="40" x2="10" y2="580" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />
  </g>

  <!-- 6: Database -->
  <g transform="translate(940, 90)">
    <rect x="-35" y="0" width="90" height="40" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)" />
    <text x="10" y="24" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">DB (Postgres)</text>
    <line x1="10" y1="40" x2="10" y2="580" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />
  </g>

  <!-- STEP 1: POST /auth/register -->
  <line x1="67" y1="155" x2="232" y2="155" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr)" />
  <text x="150" y="148" fill="#e2e8f0" font-size="11" text-anchor="middle">POST /auth/register {email, password}</text>

  <!-- STEP 2: DTO Check -->
  <rect x="232" y="165" width="10" height="45" fill="#64748b" rx="2" />
  <path d="M 242 175 C 275 175 275 190 244 195" stroke="#64748b" stroke-width="1.2" fill="none" marker-end="url(#arrDash)" />
  <text x="280" y="188" fill="#94a3b8" font-size="10">validate DTO</text>

  <!-- ALT 1: 400 Bad Request -->
  <g transform="translate(50, 215)">
    <rect x="0" y="0" width="910" height="60" rx="6" fill="#2d121a" stroke="#f43f5e" stroke-width="1" stroke-dasharray="4,3" />
    <rect x="0" y="0" width="100" height="18" rx="4" fill="#f43f5e" />
    <text x="8" y="13" fill="#ffffff" font-size="10" font-weight="700">[ALT: Lỗi DTO]</text>
    <line x1="187" y1="42" x2="17" y2="42" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrErr)" />
    <text x="102" y="36" fill="#fca5a5" font-size="10" text-anchor="middle">HTTP 400 Bad Request ("email must be an email" / "password too short")</text>
  </g>

  <!-- Forward to Controller & Service -->
  <line x1="237" y1="295" x2="422" y2="295" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr)" />
  <text x="330" y="288" fill="#e2e8f0" font-size="10" text-anchor="middle">DTO hợp lệ</text>

  <line x1="427" y1="315" x2="615" y2="315" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arr)" />
  <text x="520" y="308" fill="#e2e8f0" font-size="10" text-anchor="middle">register(dto)</text>

  <!-- Normalize email & Hash password -->
  <rect x="615" y="325" width="10" height="75" fill="#a855f7" rx="2" />
  <path d="M 625 335 C 665 335 665 350 627 355" stroke="#a855f7" stroke-width="1.2" fill="none" marker-end="url(#arr)" />
  <text x="670" y="348" fill="#d8b4fe" font-size="10">email.trim().toLowerCase()</text>

  <line x1="625" y1="375" x2="805" y2="375" stroke="#34d399" stroke-width="1.5" marker-end="url(#arr)" />
  <text x="715" y="368" fill="#a7f3d0" font-size="10" text-anchor="middle">hash(password, 12 rounds)</text>

  <line x1="805" y1="395" x2="627" y2="395" stroke="#34d399" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrDash)" />
  <text x="715" y="390" fill="#a7f3d0" font-size="9" text-anchor="middle">return passwordHash</text>

  <!-- Prisma create -->
  <line x1="625" y1="415" x2="805" y2="415" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arr)" />
  <text x="715" y="410" fill="#e2e8f0" font-size="10" text-anchor="middle">prisma.user.create({ data: {email, passwordHash} })</text>

  <line x1="810" y1="430" x2="945" y2="430" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr)" />
  <text x="877" y="424" fill="#fcd34d" font-size="10" text-anchor="middle">INSERT INTO "User"</text>

  <!-- ALT 2: 409 Duplicate Email -->
  <g transform="translate(50, 450)">
    <rect x="0" y="0" width="910" height="55" rx="6" fill="#2d121a" stroke="#f43f5e" stroke-width="1" stroke-dasharray="4,3" />
    <rect x="0" y="0" width="135" height="18" rx="4" fill="#f43f5e" />
    <text x="8" y="13" fill="#ffffff" font-size="10" font-weight="700">[ALT: Trùng Email P2002]</text>
    
    <text x="750" y="28" fill="#fca5a5" font-size="10" text-anchor="middle">Prisma error code 'P2002'</text>
    <line x1="570" y1="35" x2="17" y2="35" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrErr)" />
    <text x="290" y="29" fill="#fca5a5" font-size="10" text-anchor="middle">throw ConflictException: HTTP 409 Conflict ("Email đã được đăng ký")</text>
  </g>

  <!-- SUCCESS PATH: 201 Created -->
  <g transform="translate(50, 520)">
    <rect x="0" y="0" width="910" height="55" rx="6" fill="#063223" stroke="#10b981" stroke-width="1" />
    <rect x="0" y="0" width="130" height="18" rx="4" fill="#10b981" />
    <text x="8" y="13" fill="#ffffff" font-size="10" font-weight="700">[THÀNH CÔNG: 201]</text>

    <line x1="900" y1="35" x2="17" y2="35" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrOk)" />
    <text x="450" y="28" fill="#6ee7b7" font-size="11" font-weight="600" text-anchor="middle">HTTP 201 Created { id: 1, email: "user@example.com" } (Không trả passwordHash)</text>
  </g>

  <!-- Summary Footer -->
  <g transform="translate(25, 675)">
    <rect x="0" y="0" width="970" height="30" rx="6" fill="#1e293b" />
    <text x="20" y="19" fill="#94a3b8" font-size="11">DoD Check: 201 Created khi đăng ký mới | 409 Conflict khi email trùng | 400 Bad Request khi sai DTO | passwordHash được bảo mật tuyệt đối</text>
  </g>
</svg>
